baseURL = "https://alsspp01.github.io"
defaultContentLanguage = "en"
languageCode = "en"

title = "Yewon Min"

theme = "gokarna"

# Automatically generate robots.txt
enableRobotsTXT = true

[outputs]
  home = ["HTML", "JSON"]

[menu]
  [[menu.main]]
    identifier = "portfolio"
    name = "portfolio"
    url = "/portfolio/"
    weight = 1

    pre = "<span data-feather='briefcase'></span>"

  [[menu.main]]
    identifier = "about-me"
    name = "about me"
    url = "/about_me/"
    weight = 2

    pre = "<span data-feather='user'></span>"

  [[menu.main]]
    identifier = "projects"
    name = "projects"
    url = "/projects/"
    weight = 3

    pre = "<span data-feather='box'></span>"

  [[menu.main]]
    # Unique identifier for a menu item
    identifier = "posts"

    url = "/posts/"

    # You can add extra information before the name (HTML format is supported), such as icons
    pre = "<span data-feather='pen-tool'></span>"


    # You can add extra information after the name (HTML format is supported), such as icons
    post = ""

    # Display name
    name = "posts"

    # Weights are used to determine the ordering
    weight = 4

  [[menu.main]]
    identifier = "github"
    url = "https://github.com/alsspp01"
    weight = 5

    # We use feather-icons: https://feathericons.com/
    pre = "<span data-feather='github'></span>"

[params]
  # favicon
  favicon = "/image/profile/favicon-16x16.png"
  
  # URL for the avatar on homepage
  avatarURL = "/image/profile/MainCat.jpg"

  # Choose one of size-xs, size-s, size-m, size-l & size-xl. (Default: size-m)
  avatarSize = ""

  AvatarAltText = "Yewon Min"

  # Description to display on homepage
  description = "Project Lead · Technical Planning · Data & Automation"

  # Accent color is displayed when you hover over <a> tags
  accentColor = "#3a6f73"

  # Display "back to top" button on posts
  ShowBackToTopButton = false

  # You can use this to inject any HTML in the <head> tag.
  # Ideal usecase for this is to import custom js/css or add your analytics snippet
  customHeadHTML = """
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/site.js" defer></script>
  """

  socialIcons = [
    {name = "github", url = "https://github.com/alsspp01"},
    {name = "email", url = "mailto:alsspp01@gmail.com"}
  ]
  
  # Keywords relevant for SEO
  metaKeywords = ["Yewon Min", "portfolio", "project management", "technical planning", "data analysis", "automation"]

  # If you want to display posts on the homepage, the options are
  # "popular" (order posts by weight), "recent" (order posts by date)
  # or "" (do not display, default option)
  # showPostsOnHomePage = "popular"  # off: the homepage lists Featured Work instead

  # Footer text
  footer = "Yewon Min"
  
  # Show Previous and Next Buttons
  TogglePreviousAndNextButtons = "true"
  
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[security]
  [security.funcs]
    getenv = ["^HUGO_", "^WC_"]
